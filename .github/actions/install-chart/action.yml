# Install the chart with its default values on a kind cluster, check the
# upgrade from the update strategy of earlier charts to the default one,
# wait until the API is ready and check that
# `GET /ga4gh/tes/v1/service-info` answers (through a port forward; the
# default Ingress has no controller on kind), then run the check script for
# deployed instances (`tests/smoke/deployment.sh`, without auth: the
# default values have `auth.mode: noauth`), which runs two tasks to
# completion (one with an input, which starts a filer pod) and cancels one,
# and finally check that the filer's job completed with the filer's
# hardened defaults (`tests/smoke/check-filer.sh`). Used by the
# `chart-install` job of `ci.yml` and by `release.yml`. Needs a checkout of
# the repository.

name: Install chart
description: Install the TESK chart on a kind cluster and check the API

inputs:
  namespace:
    description: Namespace of the release
    default: tesk

runs:
  using: composite
  steps:
    # Same Helm version as in `.github/actions/test-chart`
    - name: Set up Helm
      uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: v3.22.1
    - name: Create kind cluster
      uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
      with:
        version: v0.33.0
        cluster_name: tesk
    - name: Install chart
      env:
        NAMESPACE: ${{ inputs.namespace }}
      shell: bash
      run: |
        helm install tesk charts/tesk --namespace "${NAMESPACE}" \
            --create-namespace --wait --timeout 600s
    # Releases of charts up to 0.3.0 have Kubernetes' default strategy
    # (`RollingUpdate`, with a `rollingUpdate` that Kubernetes sets); an
    # upgrade to the chart's default (`Recreate`) must replace it (with
    # Helm 3's client-side apply; see docs/upgrading.md for server-side
    # apply)
    - name: Upgrade strategy
      env:
        NAMESPACE: ${{ inputs.namespace }}
      shell: bash
      run: |
        strategy() {
          kubectl get deployment tesk-api -n "${NAMESPACE}" \
              -o jsonpath='{.spec.strategy}'
        }
        helm upgrade tesk charts/tesk --namespace "${NAMESPACE}" \
            --reset-values --set-json tesk.strategy=null --wait --timeout 600s
        before="$(strategy)"
        if ! jq -e '.type == "RollingUpdate" and .rollingUpdate != null' \
            <<< "${before}" > /dev/null; then
          echo "::error::Unexpected strategy without a value: ${before}"
          exit 1
        fi
        helm upgrade tesk charts/tesk --namespace "${NAMESPACE}" \
            --reset-values --wait --timeout 600s
        after="$(strategy)"
        if ! jq -e '. == {"type": "Recreate"}' <<< "${after}" > /dev/null; then
          echo "::error::Unexpected strategy after the upgrade: ${after}"
          exit 1
        fi
    - name: Check service info
      env:
        NAMESPACE: ${{ inputs.namespace }}
      shell: bash
      # The chart has no readiness probe, so the API may still be starting
      # after `helm install --wait`; the port forward ends on a refused
      # connection, so it is restarted until the API answers
      run: |
        body="${RUNNER_TEMP}/service-info.json"
        log="${RUNNER_TEMP}/port-forward.log"
        pid=""
        trap '[[ -n "${pid}" ]] && kill "${pid}" 2> /dev/null || true' EXIT
        for _ in $(seq 60); do
          if [[ -z "${pid}" ]] || ! kill -0 "${pid}" 2> /dev/null; then
            kubectl port-forward -n "${NAMESPACE}" service/tesk-api 8080:8080 \
                >> "${log}" 2>&1 &
            pid=$!
            sleep 2
          fi
          if curl --fail --silent --show-error --max-time 10 --output "${body}" \
              http://localhost:8080/ga4gh/tes/v1/service-info; then
            if ! jq -e '(.id | type == "string" and length > 0) and .type.group == "org.ga4gh"' "${body}"; then
              echo "::error::Unexpected service info"
              cat "${body}"
              exit 1
            fi
            exit 0
          fi
          sleep 5
        done
        echo "::error::GET /ga4gh/tes/v1/service-info did not answer"
        cat "${log}"
        kubectl get all -n "${NAMESPACE}"
        kubectl logs -n "${NAMESPACE}" deployment/tesk-api --tail=100 || true
        exit 1
    - name: Check deployment
      env:
        NAMESPACE: ${{ inputs.namespace }}
        # Shorter than the default, so that a stuck task fails within the
        # job's timeout, with the diagnostics below
        TASK_TIMEOUT: "300"
      shell: bash
      # A port forward of its own, on another port than the step above, so
      # that one left over doesn't answer instead; restarted whenever it
      # ends (e.g., on a refused connection), so that it is up again when the
      # API answers again (the script itself fails at the first request
      # without an answer). The objects and the logs of the pods help if a
      # task doesn't end as expected
      run: |
        log="${RUNNER_TEMP}/port-forward-check.log"
        url=http://localhost:8081/ga4gh/tes/v1
        (
          while true; do
            kubectl port-forward -n "${NAMESPACE}" service/tesk-api 8081:8080 \
                >> "${log}" 2>&1 || true
            sleep 1
          done
        ) &
        pid=$!
        trap 'pkill -P "${pid}" 2> /dev/null || true; kill "${pid}" 2> /dev/null || true' EXIT
        ready=false
        for _ in $(seq 30); do
          if curl --fail --silent --max-time 10 --output /dev/null "${url}/service-info"; then
            ready=true
            break
          fi
          sleep 2
        done
        if [[ "${ready}" != true ]]; then
          echo "::warning::The port forward to the API didn't answer; running the checks anyway"
        fi
        if ! tests/smoke/deployment.sh "${url}"; then
          cat "${log}" || true
          kubectl get pods,jobs,pvc -n "${NAMESPACE}" || true
          kubectl get events -n "${NAMESPACE}" --sort-by=.lastTimestamp || true
          for pod in $(kubectl get pods -n "${NAMESPACE}" -o name || true); do
            echo "::group::${pod}"
            kubectl logs -n "${NAMESPACE}" "${pod}" --all-containers --tail=50 || true
            echo "::endgroup::"
          done
          exit 1
        fi
    # The task with an input started the inputs filer; its job must have
    # completed, with the filer's hardened defaults of taskmaster 0.12.0
    # (the chart's `tesk.filer.*` contexts are empty by default)
    - name: Check filer
      env:
        NAMESPACE: ${{ inputs.namespace }}
      shell: bash
      run: |
        if ! kubectl get jobs -n "${NAMESPACE}" -o json \
            | tests/smoke/check-filer.sh; then
          kubectl get pods,jobs,pvc -n "${NAMESPACE}" || true
          exit 1
        fi

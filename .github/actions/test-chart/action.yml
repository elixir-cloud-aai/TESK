# Lint the chart (`helm lint --strict`), render it with its default values
# (`helm template`), and run the chart tests (`tests/test_chart.py`, which
# render it with other values and check the objects). Used by the `chart` job
# of `ci.yml`. The chart has no dependencies to build. Needs a checkout of the
# repository.

name: Test chart
description: Lint, render and test the TESK chart

runs:
  using: composite
  steps:
    # Same Helm version as in `.github/actions/install-chart`
    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v3.22.1
    - name: Lint chart
      shell: bash
      run: helm lint charts/tesk --strict
    - name: Render chart
      shell: bash
      run: helm template tesk charts/tesk --namespace tesk > /dev/null
    # Same Python and uv as CI's test job
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version-file: uv.lock
    # Fail instead of skipping the tests if helm is missing
    - name: Run chart tests
      shell: bash
      env:
        REQUIRE_HELM: "1"
      run: |
        uv sync --locked --group dev --python "$(which python)"
        uv run --no-sync pytest tests/test_chart.py

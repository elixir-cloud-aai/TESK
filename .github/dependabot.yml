version: 2
# No entry sets `target-branch`: pull requests go to the default branch
# (`dev`) anyway, and while `target-branch` is set, GitHub doesn't apply
# the entry's options (`labels`, `ignore`, ...) to security updates
updates:
  # The tools of the checks (dependency groups of `pyproject.toml`, locked in
  # `uv.lock`), updated together
  - package-ecosystem: uv
    labels: ["type: dependencies"]
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase-if-necessary
    groups:
      python-dependencies:
        patterns: ["*"]
  # Actions in the workflows and in the local composite actions, including
  # the pins of the shared actions of `elixir-cloud-aai/.github` (to the
  # commits of its releases, `@<commit> # vX.Y.Z`)
  - package-ecosystem: github-actions
    labels: ["type: dependencies"]
    directories:
      - /
      - /.github/actions/install-chart
      - /.github/actions/test-chart
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  # Hook revisions in `.pre-commit-config.yaml`
  - package-ecosystem: pre-commit
    labels: ["type: dependencies"]
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]

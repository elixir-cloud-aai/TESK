# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    # Python version of the tools (`requires-python` in `pyproject.toml`)
    python: "3.13"
  # The docs dependencies from the lock (`uv.lock`, dependency group
  # `docs`), as CI's docs job installs them; see "Install dependencies with
  # uv" in Read the Docs' build customization docs. Read the Docs runs these
  # commands in a shell that can't parse a command substitution with the
  # version of uv from the lock, so it installs the latest uv (`--locked`
  # still installs exactly the locked packages)
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --only-group docs

mkdocs:
  configuration: mkdocs.yml
  # Fail on all warnings to avoid broken links and references
  fail_on_warning: true

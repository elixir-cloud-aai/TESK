{{- if eq .Values.auth.mode "auth" }}
{{- $auth := .Values.auth -}}
{{- $clientId := ternary (index $auth "client_id") (index $auth "clientId") (hasKey $auth "client_id") -}}
{{- $clientSecret := ternary (index $auth "client_secret") (index $auth "clientSecret") (hasKey $auth "client_secret") }}
apiVersion: v1
kind: Secret
metadata:
  name: oauth-client-secret
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  id: {{ $clientId }}
  secret: {{ $clientSecret }}
{{- end }}

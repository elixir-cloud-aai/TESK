{{- if eq .Values.auth.mode "auth" }}
{{- $values := dict }}
{{- include "tesk.resolveValues" (dict "root" . "out" $values) }}
apiVersion: v1
kind: Secret
metadata:
  name: oauth-client-secret
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  id: {{ include "tesk.secretValue" (index $values "auth.clientId") }}
{{- /* Deprecated: tesk-api 1.2.0 and later ignore it (public client) */}}
{{- $secret := index $values "auth.clientSecret" }}
{{- if and (not (kindIs "invalid" $secret)) (ne (toString $secret) "") }}
  secret: {{ include "tesk.secretValue" $secret }}
{{- end }}
{{- end }}

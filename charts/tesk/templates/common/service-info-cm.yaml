{{- /* The service info from `serviceInfo`, unless an existing ConfigMap
replaces it (`serviceInfo.existingConfigMap`) */ -}}
{{- with include "tesk.serviceInfo" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tesk.serviceInfoName" $ }}
  labels:
    {{- include "tesk.labels" $ | nindent 4 }}
data:
  service-info.yaml: |
    {{- . | nindent 4 }}
{{- end }}

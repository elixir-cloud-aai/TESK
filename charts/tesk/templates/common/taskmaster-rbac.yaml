---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskmaster
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taskmaster
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
  - patch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - configmaps
  verbs:
  - create
  - delete
  - get
- apiGroups:
  - ""
  resources:
  - pods/log
  - pods/status
  verbs:
  - get
  - list
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: taskmaster-role-binding
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: taskmaster
roleRef:
  kind: Role
  name: taskmaster
  apiGroup: rbac.authorization.k8s.io

{{- /* Keys of earlier versions of the chart fail the installation. The
check is here because the Deployment is always rendered; it applies to the
whole chart */ -}}
{{- include "tesk.checkRemovedValues" . -}}
{{- $tesk := .Values.tesk -}}
{{- $repository := dig "image" "repository" "" $tesk | default "docker.io/elixircloud/tesk-api" -}}
{{- $tag := dig "image" "tag" "" $tesk -}}
{{- /* Not `default`, which would replace a tag of 0 */ -}}
{{- if or (kindIs "invalid" $tag) (eq (toString $tag) "") -}}
{{- $tag = .Chart.AppVersion -}}
{{- end -}}
{{- $ftpSecretName := include "tesk.ftpSecretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tesk.apiName" . }}
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "tesk.selectorLabels" . | nindent 6 }}
  replicas: 1
  template:
    metadata:
      labels:
        {{- include "tesk.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tesk.taskmasterName" . }}
      containers:
      - name: tesk-api
        image: {{ printf "%s:%s" $repository (toString $tag) }}
        {{- with dig "image" "pullPolicy" "" $tesk }}
        imagePullPolicy: {{ . }}
        {{- end }}
        resources:
          {{- toYaml ($tesk.resources | default dict) | nindent 10 }}
        env:
        - name: TESK_API_TASKMASTER_IMAGE_NAME
          value: {{ dig "taskmaster" "image" "repository" "" $tesk }}
        - name: TESK_API_TASKMASTER_IMAGE_VERSION
          value: {{ dig "taskmaster" "image" "tag" "" $tesk }}
        - name: TESK_API_TASKMASTER_FILER_IMAGE_NAME
          value: {{ dig "filer" "image" "repository" "" $tesk }}
        - name: TESK_API_TASKMASTER_FILER_IMAGE_VERSION
          value: {{ dig "filer" "image" "tag" "" $tesk }}
        - name: TESK_API_K8S_NAMESPACE
          value: {{ .Release.Namespace }}
        {{- /* The taskmasters' jobs run with this service account */}}
        - name: TESK_API_TASKMASTER_SERVICE_ACCOUNT_NAME
          value: {{ include "tesk.taskmasterName" . }}
        - name: TESK_API_TASKMASTER_ENVIRONMENT_EXECUTOR_BACKOFF_LIMIT
          value: {{ $tesk.executorRetries | quote }}
        - name: TESK_API_TASKMASTER_ENVIRONMENT_FILER_BACKOFF_LIMIT
          value: {{ $tesk.filerRetries | quote }}
        {{- /* Optional: unset or empty leaves the filer's default */}}
        {{- with $tesk.filerHttpTimeout }}
        - name: TESK_API_TASKMASTER_ENVIRONMENT_FILER_HTTP_TIMEOUT
          value: {{ toString . | quote }}
        {{- end }}
        {{- /* Only true (also as a string) keeps them; the taskmaster
        deletes them by default. A missing key renders as "<nil>" */}}
        {{- if eq (toString $tesk.keepFailedPvcs) "true" }}
        - name: TESK_API_TASKMASTER_ENVIRONMENT_KEEP_FAILED_PVC
          value: "true"
        {{- end }}
        - name: SERVER_SERVLET_CONTEXT_PATH
          value: {{ .Values.ingress.path }}
        {{- if $tesk.tesApiBasePath }}
        - name: OPENAPI_TASKEXECUTIONSERVICE_BASE_PATH
          value: {{ $tesk.tesApiBasePath }}
        {{- end }}
        - name: TESK_API_SERVICE_INFO_LOCATION
          value: file:///etc/tesk/service-info/service-info.yaml
        {{- if $ftpSecretName }}
        - name: TESK_API_TASKMASTER_FTP_SECRET_NAME
          value: {{ $ftpSecretName | quote }}
        {{- end }}
        {{- with .Values.ftp.hosts }}
        - name: TESK_API_TASKMASTER_ENVIRONMENT_TESK_FTP_HOSTS
          value: {{ join "," . | quote }}
        {{- end }}
        {{- with .Values.ftp.netrcSecret }}
        - name: TESK_API_TASKMASTER_ENVIRONMENT_NETRC_SECRET_NAME
          value: {{ . }}
        {{- end }}
        - name: TESK_API_AUTHORISATION_ENV_SUBGROUP
          value: {{ .Values.auth.envSubgroup }}
        - name: TESK_API_AUTHORISATION_BASE_GROUP
          value: {{ .Values.auth.envBasegroup }}
        - name: SPRING_PROFILES_ACTIVE
          value: {{ .Values.auth.mode }}
        {{- if not (kindIs "invalid" .Values.auth.serviceInfoPublic) }}
        - name: TESK_API_SERVICE_INFO_PUBLIC
          value: {{ .Values.auth.serviceInfoPublic | quote }}
        {{- end }}
        {{- /* Authorisation without groups, by a claim of the user info:
        only with mode auth (noauth leaves all endpoints open) and when on;
        complete, since tesk-api stops at startup without a name or a
        non-blank value. Blank values are left out, as tesk-api does */}}
        {{- $claim := default dict .Values.auth.claim }}
        {{- if and (eq (toString .Values.auth.mode) "auth") (eq (toString $claim.enabled) "true") }}
        {{- $claimName := trim (toString (default "" $claim.name)) }}
        {{- $claimValues := list }}
        {{- range (default list $claim.values) }}
        {{- with trim (toString .) }}
        {{- $claimValues = append $claimValues . }}
        {{- end }}
        {{- end }}
        {{- if or (not $claimName) (not $claimValues) }}
        {{- fail "auth.claim.enabled needs auth.claim.name and at least one value in auth.claim.values" }}
        {{- end }}
        - name: TESK_API_AUTHORISATION_CLAIM_ENABLED
          value: "true"
        - name: TESK_API_AUTHORISATION_CLAIM_NAME
          value: {{ $claimName | quote }}
        - name: TESK_API_AUTHORISATION_CLAIM_VALUES
          value: {{ join "," $claimValues | quote }}
        {{- end }}
        {{- /* Null leaves tesk-api's default (off). tesk-api stops at
        startup on anything but true or false (in any case), so fail here
        instead; strings are accepted for tools that set only strings */}}
        {{- $swaggerUi := $tesk.swaggerUi }}
        {{- if not (or (kindIs "invalid" $swaggerUi) (kindIs "map" $swaggerUi)) }}
        {{- fail (printf "tesk.swaggerUi.enabled must be true or false; tesk.swaggerUi is %q, not a map" (toString $swaggerUi)) }}
        {{- end }}
        {{- $swaggerUiEnabled := (default dict $swaggerUi).enabled }}
        {{- if not (kindIs "invalid" $swaggerUiEnabled) }}
        {{- $swaggerUiValue := lower (toString $swaggerUiEnabled) }}
        {{- if not (or (kindIs "bool" $swaggerUiEnabled) (and (kindIs "string" $swaggerUiEnabled) (has $swaggerUiValue (list "true" "false")))) }}
        {{- fail (printf "tesk.swaggerUi.enabled must be true or false, not %q" (toString $swaggerUiEnabled)) }}
        {{- end }}
        - name: TESK_API_SWAGGER_UI_ENABLED
          value: {{ $swaggerUiValue | quote }}
        {{- end }}
        {{- if .Values.transfer.active }}
        - name: TESK_API_TASKMASTER_ENVIRONMENT_HOST_BASE_PATH
          value: {{ .Values.transfer.wesBasePath }}
        - name: TESK_API_TASKMASTER_ENVIRONMENT_CONTAINER_BASE_PATH
          value: {{ .Values.transfer.tesBasePath }}
        - name: TESK_API_TASKMASTER_ENVIRONMENT_TRANSFER_PVC_NAME
          value: {{ .Values.transfer.pvcName }}
        {{- end }}
        {{- if .Values.storageClass }}
        - name: TESK_API_TASKMASTER_ENVIRONMENT_STORAGE_CLASS_NAME
          value: {{ .Values.storageClass }}
        {{- end }}
        - name: TESK_API_TASKMASTER_DEBUG
          value: "{{ $tesk.debug }}"
        - name: TESK_API_SWAGGER-OAUTH_SCOPES
          value: openid:Standard openid,eduperson_entitlement:Access to groups membership,profile:Identity info about user,email:Email
        - name: TESK_API_SWAGGER_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "tesk.oauthClientName" . }}
              key: id
              optional: true
        {{- /* Deprecated (auth.clientSecret): only tesk-api images before
        1.2.0 read it */}}
        - name: TESK_API_SWAGGER_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "tesk.oauthClientName" . }}
              key: secret
              optional: true
        {{- if $tesk.securityContext.enabled }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        {{- end }}
        {{- range $name := list "startupProbe" "readinessProbe" "livenessProbe" }}
        {{- with include "tesk.probe" (dict "root" $ "name" $name) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: service-info
          mountPath: /etc/tesk/service-info
        ports:
        - containerPort: {{ $tesk.port }}
      volumes:
      - name: service-info
        configMap:
          name: {{ include "tesk.serviceInfoName" . }}
      {{- if $tesk.securityContext.enabled }}
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- end }}

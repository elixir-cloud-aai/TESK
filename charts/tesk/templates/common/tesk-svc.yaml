{{- $service := .Values.service -}}
{{- $nodePort := ternary (index $service "node_port") (index $service "nodePort") (hasKey $service "node_port") -}}
apiVersion: v1
kind: Service
metadata:
  name: tesk-api
  labels:
    app: tesk-api
    {{- include "tesk.labels" . | nindent 4 }}
spec:
  ports:
  - port: {{ .Values.tesk.port }}
    {{- if eq .Values.service.type "NodePort" }}
    # Valid only with type NodePort
    nodePort: {{ $nodePort }}
    {{- end }}
  selector:
    app: tesk-api
  type: {{ .Values.service.type | default "ClusterIP" }}

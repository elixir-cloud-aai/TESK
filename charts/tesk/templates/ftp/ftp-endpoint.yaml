{{- if .Values.ftp.hostip }}
{{- /* Named as the Service (ftp-service.yaml) */}}
apiVersion: v1
kind: Endpoints
metadata:
  name: ftp
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
subsets:
- addresses:
  # IP of the host as pods see it (e.g., IPv4 address from vboxnet0)
  - ip: {{ .Values.ftp.hostip }}
  ports:
  - port: 21
{{- end }}

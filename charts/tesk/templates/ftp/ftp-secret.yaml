{{- $ftp := .Values.ftp -}}
{{- $classicFtpSecret := ternary (index $ftp "classic_ftp_secret") (index $ftp "classicFtpSecret") (hasKey $ftp "classic_ftp_secret") -}}
{{- if $classicFtpSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $classicFtpSecret }}
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.ftp.username }}
  password: {{ .Values.ftp.password }}
{{- end }}

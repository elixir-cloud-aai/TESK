{{- $values := dict -}}
{{- include "tesk.resolveValues" (dict "root" . "out" $values) -}}
{{- if index $values "ftp.classicFtpSecret" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $values "ftp.classicFtpSecret" }}
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ include "tesk.secretValue" .Values.ftp.username }}
  password: {{ include "tesk.secretValue" .Values.ftp.password }}
{{- end }}

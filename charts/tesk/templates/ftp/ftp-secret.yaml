{{- with include "tesk.ftpSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ . }}
  labels:
    {{- include "tesk.labels" $ | nindent 4 }}
type: Opaque
stringData:
  username: {{ include "tesk.secretValue" $.Values.ftp.username }}
  password: {{ include "tesk.secretValue" $.Values.ftp.password }}
{{- end }}

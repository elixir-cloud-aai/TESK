{{- if .Values.ftp.hostIp }}
{{- /* A fixed name: tasks reach the FTP server as ftp://ftp/ */}}
apiVersion: v1
kind: Service
metadata:
  name: ftp
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
spec:
  ports:
  - protocol: TCP
    # Inside the cluster
    port: 21
    # At the host
    targetPort: 21
{{- end }}

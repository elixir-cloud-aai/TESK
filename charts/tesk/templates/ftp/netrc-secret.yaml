{{- $ftp := .Values.ftp -}}
{{- $netrcSecret := ternary (index $ftp "netrc_secret") (index $ftp "netrcSecret") (hasKey $ftp "netrc_secret") -}}
{{- if $netrcSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $netrcSecret }}
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  .netrc: |-
{{ .Files.Get "ftp/.netrc" | indent 4 }}
{{- end }}

{{- $values := dict -}}
{{- include "tesk.resolveValues" (dict "root" . "out" $values) -}}
{{- if index $values "ftp.netrcSecret" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $values "ftp.netrcSecret" }}
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  .netrc: |-
{{ .Files.Get "ftp/.netrc" | indent 4 }}
{{- end }}

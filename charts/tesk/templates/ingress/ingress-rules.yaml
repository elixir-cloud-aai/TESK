{{- if .Values.ingress.rules }}
{{- $values := dict }}
{{- include "tesk.resolveValues" (dict "root" . "out" $values) }}
{{- $hostName := index $values "hostName" }}
{{- $tlsSecretName := index $values "ingress.tlsSecretName" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-rules
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- if $tlsSecretName }}
  tls:
  - hosts:
    - {{ $hostName }}
    secretName: {{ $tlsSecretName }}
  {{- end }}
  rules:
  - host: {{ $hostName }}
    http:
      paths:
      - path: {{ .Values.ingress.path }}
        pathType: Prefix
        backend:
          service:
            name: tesk-api
            port:
              number: {{ .Values.tesk.port }}
{{- end }}

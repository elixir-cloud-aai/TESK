{{- if .Values.ingress.enabled }}
{{- $hostName := .Values.hostName }}
{{- $tlsSecretName := .Values.ingress.tlsSecretName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tesk.fullname" . }}
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $tlsSecretName }}
  tls:
  - hosts:
    - {{ $hostName }}
    secretName: {{ $tlsSecretName }}
  {{- end }}
  rules:
  - host: {{ $hostName }}
    http:
      paths:
      - path: {{ .Values.ingress.path }}
        pathType: Prefix
        backend:
          service:
            name: {{ include "tesk.apiName" . }}
            port:
              number: {{ .Values.tesk.port }}
{{- end }}

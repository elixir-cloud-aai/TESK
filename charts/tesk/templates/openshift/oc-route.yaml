{{- if and (.Capabilities.APIVersions.Has "route.openshift.io/v1") (not .Values.ingress.enabled) }}
{{- $hostName := .Values.hostName }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "tesk.fullname" . }}
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
spec:
  host: {{ $hostName }}
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: {{ include "tesk.apiName" . }}
    weight: 100
  wildcardPolicy: None
status:
  ingress:
  - conditions:
    host: {{ $hostName }}
    routerName: router
    wildcardPolicy: None
{{- end }}

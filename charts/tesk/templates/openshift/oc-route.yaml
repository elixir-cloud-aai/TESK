{{- if and (.Capabilities.APIVersions.Has "route.openshift.io/v1") (eq .Values.ingress.rules false) }}
{{- $values := dict }}
{{- include "tesk.resolveValues" (dict "root" . "out" $values) }}
{{- $hostName := index $values "hostName" }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: tesk-svc
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
spec:
  host: {{ $hostName }}
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: tesk-api
    weight: 100
  wildcardPolicy: None
status:
  ingress:
  - conditions:
    host: {{ $hostName }}
    routerName: router
    wildcardPolicy: None
{{- end }}

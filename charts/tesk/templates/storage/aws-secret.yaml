{{- if eq .Values.storage "s3" }}
{{- /* A fixed name: the filer (tesk-core) mounts this secret by name */}}
apiVersion: v1
kind: Secret
metadata:
  name: aws-secret
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
data:
  config: {{ .Files.Get "s3-config/config" | b64enc }}
  credentials: {{ .Files.Get "s3-config/credentials" | b64enc }}
{{- end }}

{{- if eq .Values.storage "openstack" }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ include "tesk.fullname" . }}-gold
  labels:
    {{- include "tesk.labels" . | nindent 4 }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
parameters:
  availability: nova
provisioner: kubernetes.io/cinder
{{- end }}

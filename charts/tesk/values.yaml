# Default values for tesk.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#
# The keys follow Helm's conventions (camelCase, `enabled` switches). The
# keys of earlier versions of the chart (e.g., `host_name` or
# `ingress.rules`) fail the installation, as do unknown keys of the chart's
# own maps (`values.schema.json`): see the upgrade notes
# (docs/upgrading.md) for the old and new keys.

# The names of the chart's objects start with the release name, followed by
# the chart's name (`tesk`) unless the release name contains it: e.g.,
# `tesk-api` for the release `tesk`, `prod-tesk-api` for the release `prod`.
# `nameOverride` replaces the chart's name in the names and in the label
# `app.kubernetes.io/name`; `fullnameOverride` replaces the whole prefix.
# Prefixes are cut to 50 characters
nameOverride: ""
fullnameOverride: ""

# Host name (FQDN) of the API, for the Ingress or the OpenShift Route, e.g.,
# tes.example.org
hostName: ""

# Storage backend that the chart sets up: `s3` creates the secret `aws-secret`
# from the files in `s3-config/` (a fixed name, which the filer reads: one
# release per namespace can use it), `openstack` a default storage class
# `<prefix>-gold` for OpenStack Cinder (one per cluster); anything else
# (e.g., `none`) adds nothing
storage: none

# Storage class of the tasks' PVCs; empty uses the cluster's default class
storageClass:

tesk:
  # Image of the API (tesk-api)
  image:
    repository: docker.io/elixircloud/tesk-api
    # Defaults to the chart's `appVersion`
    tag: ""
    # `Always`, `IfNotPresent` or `Never`; empty leaves Kubernetes' default
    pullPolicy: ""
  # Port of the API's container and Service
  port: 8080
  # Base path of the TES API; empty uses tesk-api's default (/ga4gh/tes/v1)
  tesApiBasePath: /ga4gh/tes/v1
  # Image of the taskmaster (tesk-core), which runs each task
  taskmaster:
    image:
      repository: docker.io/elixircloud/tesk-core-taskmaster
      tag: 0.11.0
  # Image of the filer (tesk-core), which stages the inputs and outputs; its
  # tag must be the same release as the taskmaster's (the installation
  # fails otherwise, from 0.11.0 on)
  filer:
    image:
      repository: docker.io/elixircloud/tesk-core-filer
      tag: 0.11.0
  # The executors, which run the task's commands
  executor:
    # Security context of the executors' pods, e.g., to run them as non-root
    # users: `runAsUser`, `runAsGroup`, `fsGroup` (integers) and
    # `runAsNonRoot` (true or false); tesk-api reads no other fields. Empty
    # leaves the executors as their images say (often root). `fsGroup` also
    # gives executors access to the files that the filer stages on the
    # task's PVC, on volume types whose ownership Kubernetes manages. Not
    # applied to the API (see `tesk.podSecurityContext`), the taskmaster
    # and the filer. tesk-api reads it at startup, so a change restarts the
    # API's pod
    securityContext: {}
  # Debug logging in the taskmasters
  debug: false
  # Retries of an executor's job, and of a filer's job, on errors
  executorRetries: 2
  filerRetries: 2
  # Timeout of the filer's HTTP(S) requests, in seconds, for connecting and
  # for each read (not the whole transfer); empty uses the filer's default
  # (300). Takes effect with taskmaster and filer images newer than v0.10.6
  filerHttpTimeout: ""
  # Keep the PVCs of tasks that fail or are cancelled, e.g. to inspect their
  # files (delete them by hand then); false lets the taskmaster delete them.
  # Taskmaster images up to v0.10.6 always keep them
  keepFailedPvcs: false
  # Seconds after which Kubernetes deletes a finished task's jobs and pods
  # (0 to 2147483647). The task is then gone from the API, so leave clients
  # (e.g., workflow engines) hours to read it: e.g., 86400 (a day) or 604800
  # (a week). Empty keeps finished tasks. Takes effect with taskmaster images
  # newer than v0.10.6, for tasks created after the API's pod restarted
  # with it
  taskTtlSeconds: ""
  # Seconds that a pod of a task may wait for a node (1 to 2147483647) before
  # the task fails with SYSTEM_ERROR, e.g., 3600 (an hour) or 86400 (a day).
  # Empty waits forever. Needs taskmaster images newer than v0.10.6 and a
  # tesk-api image newer than 1.1 (`tesk.image.tag`), which reports such
  # tasks correctly; older ones report them as COMPLETE
  maxQueueSeconds: ""

  # Resources of the API's container
  resources:
    limits:
      cpu: 1
      memory: 2048Mi
    requests:
      cpu: 1
      memory: 2048Mi

  # Probes of the API's container: `startupProbe` (holds off the others
  # while the API starts, which takes about a minute), `readinessProbe` (the
  # Service and Ingress send requests to the pod, and `helm install --wait`
  # returns, once it succeeds) and `livenessProbe` (restarts the container if
  # it fails). Each takes the fields of a Kubernetes probe, merged with the
  # defaults of the chart (startup: every 5 s, up to 60 failures; readiness:
  # every 10 s; liveness: every 20 s; timeout 5 s, 3 failures for both), and
  # `enabled: false` leaves it out. By default, they request
  # `GET <ingress.path><tesApiBasePath>/service-info`; with `auth.mode: auth`
  # and `auth.serviceInfoPublic: false` (the endpoint needs a token), they
  # check the port. An `exec` or `grpc` of your own, or a `tcpSocket` where
  # `httpGet` is the default (and the reverse), replaces that; fields of the
  # default kind are merged with it. The defaults are in the template
  # `tesk.probe` (`_helpers.tpl`).
  startupProbe: {}
  readinessProbe: {}
  livenessProbe: {}

  # Security context of the API's pod and of its container: a non-root user
  # (UID 1000) with the `RuntimeDefault` seccomp profile, no privilege
  # escalation and no capabilities. Your values are merged with these; null
  # removes a field (e.g., `podSecurityContext.runAsUser: null` on OpenShift,
  # which assigns the user) or the whole context
  podSecurityContext:
    runAsUser: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Swagger UI of the API (at `ingress.path`): turning it on serves the
  # Swagger UI publicly; enable it only where needed. true or false only;
  # null leaves tesk-api's default (off). Needs tesk-api 1.2.0 or later
  # (`tesk.image.tag`); earlier versions ignore this and always serve the
  # Swagger UI
  swaggerUi:
    enabled: false

transfer:
  # Support for local file systems (`file:` URLs in inputs and outputs) on a
  # shared PVC
  enabled: false
  # Path where the workflow engine sees the shared volume, e.g., `/data` for
  # WES-ELIXIR via docker-compose, `/tmp` for WES-ELIXIR run locally (change
  # `$wesBasePath` in minikubeStart accordingly)
  wesBasePath: /tmp
  # Path where the filer mounts the shared PVC
  tesBasePath: /transfer
  # Name of the shared PVC (not created by the chart)
  pvcName: transfer-pvc

auth:
  # `auth` requires OIDC access tokens; `noauth` leaves all endpoints open
  mode: noauth
  # Group model of LS Login (ELIXIR AAI): the base group and the subgroup of
  # this deployment (e.g., EBI or CSC) that grant access
  envSubgroup: CSC
  envBaseGroup: ECP_CLN
  # With mode auth: true lets GET /service-info answer without a token, false
  # requires a valid token for it. Needs tesk-api 1.2.0 or later
  # (`tesk.image.tag`); earlier versions ignore this and keep the endpoint
  # public. No effect with mode noauth, where all endpoints are open.
  serviceInfoPublic: true
  # With mode auth: true matches tasks created by tesk-api before 1.2.0 to
  # their creators too, by the label in which these versions recorded the
  # creator. tesk-api 1.2.0 records creators without loss in other labels,
  # so these tasks only belong to their creators with this setting. Turn it
  # on for a transition after the upgrade, and off again once the old tasks
  # are no longer needed: while it is on, tesk-api filters lists of tasks
  # itself. false (or null) leaves it unset, so tesk-api's default (off)
  # applies. Needs tesk-api 1.2.0 or later; see
  # https://github.com/elixir-cloud-aai/tesk-api/blob/v1.2.0/docs/upgrading.md
  legacyUserLabels: false
  # With mode auth: authorisation without groups, by a claim of the user info,
  # for providers whose groups don't fit the group model above (e.g., LS
  # Login). Off by default, and ignored with mode noauth. With `enabled:
  # true`, users with one of `values` (compared exactly) in the claim `name`
  # may run tasks and see their own; group rules still apply first. Everyone
  # who has one of the values can run any image on the cluster: choose an
  # entitlement that an administrator grants, not a value that every account
  # has. Needs tesk-api 1.2.0 or later (`tesk.image.tag`); see
  # https://github.com/elixir-cloud-aai/tesk-api/blob/v1.2.0/docs/access-control.md#authorisation-without-groups
  claim:
    enabled: false
    # e.g., eduperson_entitlement
    name: ""
    # e.g., [urn:geant:example.org:group:tesk#example.org]; no commas
    values: []
  # The OIDC client of the Swagger UI (`clientId`): put it into a separate
  # values file (secrets.yaml), not into this one. The Swagger UI is a public
  # client, which needs no secret: `clientSecret` is deprecated, and
  # ignored by tesk-api 1.2.0 and later; leave it unset

service:
  # Type of the API's Service: `NodePort` to expose the API directly,
  # `LoadBalancer` on clusters of cloud providers, or empty for `ClusterIP`
  type: ""
  # Node port with type `NodePort` (30000-32767), e.g., 31567
  nodePort: ""

ftp:
  # If you need FTP, choose one of the 2 methods of providing credentials:
  # a secret created from `ftp.username` and `ftp.password` (put them into
  # secrets.yaml), named `classicFtpSecret`, or `<prefix>-ftp` if that is
  # null; or the name of a secret created from the file `ftp/.netrc` (e.g.,
  # `netrc-secret`, with `classicFtpSecret` empty, which creates no FTP
  # secret)
  classicFtpSecret:
  netrcSecret:
  # The hosts that the filer sends the credentials of `classicFtpSecret` to,
  # e.g., [ftp.example.org]: `host` or `host:port` (IPv6 addresses in
  # brackets), matched exactly, ignoring case; an entry without a port
  # matches port 21 only. Empty: the credentials are sent to no host, and the
  # filer logs in anonymously. Not needed for `.netrc`. Takes effect with
  # taskmaster and filer images newer than v0.10.6
  hosts: []
  # If you run FTP locally, outside of Kubernetes, and need a DNS entry for it
  # (because your workflow engine might not like the IP address), the chart
  # can create a Service without a selector, named `ftp` (a fixed name, so
  # one release per namespace can use it): put the IP under
  # which your pods see services running on your host (it depends on how you
  # installed Kubernetes; for VirtualBox, it is 192.168.99.1). Tasks can then
  # use it like this: ftp://ftp/file
  hostIp:

ingress:
  # Creates an Ingress for `hostName`; false creates an OpenShift Route
  # instead, on OpenShift
  enabled: true
  # Ingress class; empty uses the cluster's default class
  className: ""
  # Path of the Ingress, and the context path of the API
  path: /
  # Secret with the TLS certificate of `hostName`; empty switches TLS off
  tlsSecretName:
  # Annotations of the Ingress
  annotations:
    kubernetes.io/tls-acme: "true"
    # Choose one of the following depending on your setup
    # cert-manager.io/issuer: letsencrypt-production
    cert-manager.io/cluster-issuer: letsencrypt-production

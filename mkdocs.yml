site_name: TESK
site_description: >-
  GA4GH Task Execution Service on Kubernetes, by ELIXIR On-Cloud
# Read the Docs serves each version under its own path (e.g., `/en/latest/`)
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://tesk.readthedocs.io/en/latest/"]
repo_url: https://github.com/elixir-cloud-aai/TESK
repo_name: elixir-cloud-aai/TESK
edit_uri: edit/dev/docs/
copyright: Copyright &copy; ELIXIR On-Cloud

# Python hooks of the build (not part of the site, nor their bytecode)
exclude_docs: |
  hooks.py
  __pycache__/
# Pull the docs of tesk-api and tesk-core (`docs-sources.yml`) into the
# sections marked `external:<name>` in `nav` (see `docs/hooks.py`)
hooks:
  - docs/hooks.py

watch:
  - docs-sources.yml

theme:
  name: material
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  # Pages of the earlier Sphinx docs, which may be linked from elsewhere
  - redirects:
      redirect_maps:
        tesintro.html.md: tesintro.md
        deployment.html.md: deployment.md
        integrated_wes_tes.html.md: integrated_wes_tes.md
        local_ftp.html.md: local_ftp.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# `external:<name>` marks the section of the docs pulled from another
# repository (`docs-sources.yml`, `docs/hooks.py`)
nav:
  - Home: index.md
  - Introduction to TES: tesintro.md
  - Architecture: architecture.md
  - Deployment: deployment.md
  - Configuration: configuration.md
  - API: api.md
  - Upgrading: upgrading.md
  - Guides:
      - Integration with WES: integrated_wes_tes.md
      - TESK on MicroK8s: microk8s.md
      - Local FTP server: local_ftp.md
  - tesk-api: external:tesk-api
  - tesk-core: external:tesk-core
  - Development: development.md

---
# Source: tesk/templates/common/tesk-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tesk-api
spec:
  selector:
    matchLabels:
      app: tesk-api
  replicas: 1
  template:
    metadata:
      labels:
        app: tesk-api
    spec:
      serviceAccountName: taskmaster
      containers:
      - name: tesk-api
        image: docker.io/elixircloud/tesk-api:1.1.0
        resources:
          limits:
            cpu: 1
            memory: 2048Mi
          requests:
             cpu: 1
             memory: 2048Mi
        env:
        - name: TESK_API_TASKMASTER_IMAGE_NAME
          value: docker.io/elixircloud/tesk-core-taskmaster
        - name: TESK_API_TASKMASTER_IMAGE_VERSION
          value: v0.10.6
        - name: TESK_API_TASKMASTER_FILER_IMAGE_NAME
          value: docker.io/elixircloud/tesk-core-filer
        - name: TESK_API_TASKMASTER_FILER_IMAGE_VERSION
          value: v0.10.6
        - name: TESK_API_K8S_NAMESPACE
          value: tesk
        - name: TESK_API_TASKMASTER_SERVICE_ACCOUNT_NAME
          value: taskmaster
        - name: TESK_API_TASKMASTER_ENVIRONMENT_EXECUTOR_BACKOFF_LIMIT
          value: "2"
        - name: TESK_API_TASKMASTER_ENVIRONMENT_FILER_BACKOFF_LIMIT
          value: "2"
        - name: SERVER_SERVLET_CONTEXT_PATH
          value: /

        - name: OPENAPI_TASKEXECUTIONSERVICE_BASE_PATH
          value: /ga4gh/tes/v1

        - name: TESK_API_SERVICE_INFO_LOCATION
          value: file:///etc/tesk/service-info/service-info.yaml

        - name: TESK_API_TASKMASTER_FTP_SECRET_NAME
          value: ftp-secret


        - name: TESK_API_AUTHORISATION_ENV_SUBGROUP
          value: CSC
        - name: TESK_API_AUTHORISATION_BASE_GROUP
          value: ECP_CLN
        - name: SPRING_PROFILES_ACTIVE
          value: noauth
        - name: TESK_API_SERVICE_INFO_PUBLIC
          value: "true"
        - name: TESK_API_SWAGGER_UI_ENABLED
          value: "false"





        - name: TESK_API_TASKMASTER_DEBUG
          value: "false"

        - name: TESK_API_SWAGGER-OAUTH_SCOPES
          value: openid:Standard openid,eduperson_entitlement:Access to groups membership,profile:Identity info about user,email:Email
        - name: TESK_API_SWAGGER_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth-client-secret
              key: id
              optional: true
        - name: TESK_API_SWAGGER_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth-client-secret
              key: secret
              optional: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
          - name: service-info-config
            mountPath: /etc/tesk/service-info

        ports:
        - containerPort: 8080
      volumes:
        - name: service-info-config
          configMap:
            name: service-info-config
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
# Source: tesk/templates/ingress/ingress-rules.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-rules
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    kubernetes.io/tls-acme: "true"
spec:
  ingressClassName:

  rules:
  - host:
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tesk-api
            port:
              number: 8080
